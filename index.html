<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초등 4학년 영어 발음 놀이터</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }

  body {
    background-color: #eef2ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    color: #1e293b;
  }

  .wrap {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 10px 25px rgba(30, 41, 59, 0.1);
    overflow: hidden;
  }

  .top-bar {
    background: #3b82f6;
    color: #ffffff;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .top-bar h1 {
    font-size: 1.15rem;
    font-weight: 800;
  }

  .score-pill {
    background: rgba(255, 255, 255, 0.25);
    padding: 5px 14px;
    border-radius: 99px;
    font-weight: 700;
    font-size: 0.95rem;
  }

  .view {
    display: none;
    padding: 24px;
  }

  .view.active {
    display: block;
  }

  /* 메인 메뉴 화면 */
  .intro {
    text-align: center;
    margin-bottom: 20px;
  }

  .intro h2 {
    font-size: 1.3rem;
    margin-bottom: 6px;
    color: #0f172a;
  }

  .intro p {
    font-size: 0.9rem;
    color: #64748b;
  }

  .status-panel {
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }

  .status-box strong {
    display: block;
    font-size: 1.25rem;
    color: #3b82f6;
  }

  .status-box span {
    font-size: 0.78rem;
    color: #64748b;
    font-weight: 600;
  }

  .menu-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .menu-card {
    width: 100%;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    padding: 16px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.15s, background-color 0.15s;
  }

  .menu-card:hover {
    border-color: #3b82f6;
    background-color: #eff6ff;
  }

  .menu-card.primary-card {
    border-color: #3b82f6;
    background-color: #eff6ff;
  }

  .menu-card h3 {
    font-size: 1.02rem;
    color: #0f172a;
    margin-bottom: 4px;
  }

  .menu-card p {
    font-size: 0.82rem;
    color: #475569;
  }

  .menu-emoji {
    font-size: 1.8rem;
    margin-left: 12px;
  }

  /* 학습 화면 */
  .nav-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .btn-exit {
    background: #f1f5f9;
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-weight: 700;
    color: #475569;
    cursor: pointer;
  }

  .bar-bg {
    flex: 1;
    height: 10px;
    background: #e2e8f0;
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: #10b981;
    transition: width 0.3s;
  }

  .step-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: #64748b;
  }

  .card-box {
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 20px;
    padding: 22px 16px;
    text-align: center;
    margin-bottom: 16px;
  }

  .badge-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .tag {
    font-size: 0.76rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
    background: #dbeafe;
    color: #1d4ed8;
  }

  .tag.review-tag {
    background: #fef3c7;
    color: #b45309;
  }

  .pic {
    font-size: 3.6rem;
    margin-bottom: 8px;
  }

  .target-display {
    font-size: 1.85rem;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 6px;
    line-height: 1.4;
  }

  /* 강세, 연음, 억양 시각 스타일 */
  .loud {
    color: #d97706;
    text-decoration: underline 3px #f59e0b;
    text-underline-offset: 4px;
  }

  .soft {
    color: #64748b;
    font-weight: 600;
    font-size: 0.9em;
  }

  .sound-hl {
    background: #dbeafe;
    color: #1d4ed8;
    padding: 0 4px;
    border-radius: 5px;
  }

  .tie {
    color: #ec4899;
    font-weight: 900;
  }

  .tone {
    color: #10b981;
    font-weight: 900;
    margin-left: 4px;
  }

  .beat-line {
    font-size: 0.88rem;
    color: #d97706;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .meaning {
    font-size: 1.05rem;
    color: #475569;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .guide-note {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 0.84rem;
    color: #334155;
    margin-bottom: 14px;
    line-height: 1.4;
  }

  .sound-btns {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .btn-snd {
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    color: #1e293b;
    cursor: pointer;
  }

  .btn-snd:hover {
    border-color: #3b82f6;
    color: #3b82f6;
  }

  .msg-box {
    background: #f1f5f9;
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    min-height: 68px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-bottom: 16px;
  }

  .msg-main {
    font-size: 0.96rem;
    font-weight: 700;
    color: #1d4ed8;
  }

  .msg-sub {
    font-size: 0.86rem;
    color: #475569;
    margin-top: 4px;
  }

  .controls-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
  }

  .btn-speak {
    background: #3b82f6;
    color: #ffffff;
    border: none;
    border-radius: 99px;
    padding: 14px 28px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
  }

  .btn-speak.recording {
    background: #ef4444;
  }

  .btn-next-step {
    background: #10b981;
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 14px 24px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    display: none;
  }

  .btn-pass {
    background: #e2e8f0;
    color: #475569;
    border: none;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* 완료 화면 */
  .done-box {
    text-align: center;
    padding: 20px 0;
  }

  .done-box .big-icon {
    font-size: 4.5rem;
    margin-bottom: 12px;
  }

  .done-box h2 {
    font-size: 1.5rem;
    margin-bottom: 8px;
  }

  .done-box p {
    color: #475569;
    font-size: 0.95rem;
    line-height: 1.5;
    margin-bottom: 24px;
  }

  .btn-restart {
    width: 100%;
    background: #3b82f6;
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <h1>🗣️ 초등 4학년 영어 발음 놀이터</h1>
    <div class="score-pill">⭐ <span id="starCount">0</span></div>
  </div>

  <!-- 1. 시작 화면 -->
  <div id="viewMenu" class="view active">
    <div class="intro">
      <h2>소리, 강세, 리듬, 억양을 연습해요!</h2>
      <p>원하는 단계를 누르면 바로 연습이 시작됩니다.</p>
    </div>

    <div class="status-panel">
      <div class="status-box">
        <strong id="cntReady">24</strong>
        <span>전체 표현</span>
      </div>
      <div class="status-box">
        <strong id="cntReview">0</strong>
        <span>복습 대기</span>
      </div>
      <div class="status-box">
        <strong id="cntDone">0</strong>
        <span>완료한 표현</span>
      </div>
    </div>

    <div class="menu-grid">
      <button type="button" class="menu-card primary-card" onclick="App.begin('mix')">
        <div>
          <h3>🚀 오늘의 분산 반복 코스 (6문제)</h3>
          <p>복습이 필요한 표현과 새 표현을 섞어서 연습해요</p>
        </div>
        <span class="menu-emoji">🎯</span>
      </button>

      <button type="button" class="menu-card" onclick="App.begin(1)">
        <div>
          <h3>1단계: 낱소리 & 단어 강세</h3>
          <p>자음·모음의 정확한 소리와 강하게 읽는 강세를 배워요</p>
        </div>
        <span class="menu-emoji">🔤</span>
      </button>

      <button type="button" class="menu-card" onclick="App.begin(2)">
        <div>
          <h3>2단계: 강약 리듬 & 연음</h3>
          <p>리듬 박자(● · ●)와 이어 읽는 연음(‿)을 연습해요</p>
        </div>
        <span class="menu-emoji">🎵</span>
      </button>

      <button type="button" class="menu-card" onclick="App.begin(3)">
        <div>
          <h3>3단계: 문장 리듬 & 억양</h3>
          <p>문장의 강약 리듬과 끝을 올리고(↗) 내리는(↘) 억양을 익혀요</p>
        </div>
        <span class="menu-emoji">💬</span>
      </button>
    </div>
  </div>

  <!-- 2. 연습 화면 -->
  <div id="viewStudy" class="view">
    <div class="nav-row">
      <button type="button" class="btn-exit" onclick="App.goMenu()">← 메뉴</button>
      <div class="bar-bg">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <span class="step-label" id="stepLabel">1/6</span>
    </div>

    <div class="card-box">
      <div class="badge-row">
        <span class="tag" id="levelTag">1단계</span>
        <span class="tag" id="pointTag">강세 연습</span>
      </div>

      <div class="pic" id="itemPic">🍎</div>
      <div class="target-display" id="itemDisplay">apple</div>
      <div class="beat-line" id="itemBeat">리듬: ● ·</div>
      <div class="meaning" id="itemKo">사과</div>
      <div class="guide-note" id="itemTip">팁 내용</div>

      <div class="sound-btns">
        <button type="button" class="btn-snd" onclick="App.playAudio(1.0)">🔊 보통 듣기</button>
        <button type="button" class="btn-snd" onclick="App.playAudio(0.65)">🐢 느리게 듣기</button>
      </div>
    </div>

    <div class="msg-box">
      <div class="msg-main" id="msgMain">먼저 '보통 듣기'를 누르고 따라 말해보세요!</div>
      <div class="msg-sub" id="msgSub"></div>
    </div>

    <div class="controls-row">
      <button type="button" class="btn-speak" id="btnMic" onclick="App.listen()">🎤 따라 말하기</button>
      <button type="button" class="btn-next-step" id="btnNext" onclick="App.next()">다음 문제 ➡️</button>
      <button type="button" class="btn-pass" id="btnPass" onclick="App.pass()">건너뛰기</button>
    </div>
  </div>

  <!-- 3. 완료 화면 -->
  <div id="viewDone" class="view">
    <div class="done-box">
      <div class="big-icon">🏆</div>
      <h2>연습을 멋지게 마쳤어요!</h2>
      <p id="doneText">정말 잘했어요!</p>
      <button type="button" class="btn-restart" onclick="App.goMenu()">처음 화면으로 돌아가기</button>
    </div>
  </div>
</div>

<script>

      beat: '· ● ● ·', tip: '<strong>like‿apples</strong>를 연음으로 잇고, 문장 끝 억양을 차분하게 내려요(↘).' },
    { id: 18, lv: 3, word: 'How are you?', ko: '기분이 어때요?', pic: '😊', point: '의문사 질문 억양',
      html: '<span class="loud">How</span> <span class="soft">are</span> <span class="loud">you?</span><span class="tone">↘</span>',
      beat: '● · ●', tip: '<strong>How</strong>로 시작하는 질문은 끝 억양을 살짝 내리며(↘) 자연스럽게 물어요.' },
    { id: 19, lv: 3, word: 'Can you swim?', ko: '너는 수영할 수 있니?', pic: '🏊', point: '올라가는 억양',
      html: '<span class="soft">Can you</span> <span class="loud">swim?</span><span class="tone">↗</span>',
      beat: '· · ●', tip: 'Yes/No로 답하는 질문이에요! 마지막 <strong>swim?</strong> 끝 억양을 높게 올려요(↗).' },
    { id: 20, lv: 3, word: 'What is this?', ko: '이것은 무엇인가요?', pic: '❓', point: '연음 & 내려가는 억양',
      html: '<span class="loud">What</span><span class="tie">‿</span><span class="soft">is</span> <span class="loud"><span class="sound-hl">th</span>is?</span><span class="tone">↘</span>',
      beat: '● · ●', tip: '<strong>What‿is</strong>(워리즈)를 연음으로 잇고 <strong>this</strong>의 th 소리를 살려요.' },
    { id: 21, lv: 3, word: 'It is a cute cat.', ko: '그것은 귀여운 고양이예요.', pic: '🐱', point: '연음 & 문장 리듬',
      html: '<span class="soft">It</span><span class="tie">‿</span><span class="soft">is</span><span class="tie">‿</span><span class="soft">a</span> <span class="loud">cute</span> <span class="loud">cat.</span><span class="tone">↘</span>',
      beat: '· · · ● ●', tip: '앞부분 <strong>It‿is‿a</strong>(이리저)는 약하고 빠르게, <strong>cute cat</strong>에는 강세를 주세요!' },
    { id: 22, lv: 3, word: 'Are you happy?', ko: '너는 행복하니?', pic: '😄', point: '올라가는 억양',
      html: '<span class="soft">Are you</span> <span class="loud">hap</span><span class="soft">py?</span><span class="tone">↗</span>',
      beat: '· · ● ·', tip: '묻는 말이므로 <strong>happy?</strong>의 끝 억양을 위로 경쾌하게 올려주세요(↗).' },
    { id: 23, lv: 3, word: 'Open the door, please.', ko: '문을 열어 주세요.', pic: '🚪', point: '문장 리듬 & 내려가는 억양',
      html: '<span class="loud">O</span><span class="soft">pen the</span> <span class="loud">door,</span> <span class="loud">please.</span><span class="tone">↘</span>',
      beat: '● · · ● ●', tip: '<strong>O</strong>-<strong>door</strong>-<strong>please</strong> 세 곳에 강세를 주고 공손하게 억양을 내려요.' },
    { id: 24, lv: 3, word: 'See you tomorrow.', ko: '내일 또 만나요.', pic: '👋', point: '단어 강세 & 인사 억양',
      html: '<span class="loud">See</span> <span class="soft">you to</span>-<span class="loud">mor</span>-<span class="soft">row.</span><span class="tone">↘</span>',
      beat: '● · · ● ·', tip: '<strong>See</strong>와 tomorrow의 가운데 <strong>mor</strong>에 강세를 주어 리듬감 있게 말해요!' }
  ];

  // 순수 메모리 기반 분산 반복 학습 상태
  let stars = 0;
  let reviewPool = []; // 복습이 필요한 항목 ID 목록
  let masteredIds = []; // 완벽히 통과한 항목 ID 목록

  let queue = [];
  let idx = 0;
  let tries = 0;
  let earnedInRound = 0;
  let rec = null;
  let listening = false;

  function showView(id) {
    document.getElementById('viewMenu').className = 'view';
    document.getElementById('viewStudy').className = 'view';
    document.getElementById('viewDone').className = 'view';
    document.getElementById(id).className = 'view active';
  }

  function refreshMenu() {
    document.getElementById('starCount').textContent = stars;
    document.getElementById('cntReady').textContent = DATA.length;
    document.getElementById('cntReview').textContent = reviewPool.length;
    document.getElementById('cntDone').textContent = masteredIds.length;
  }

  function begin(mode) {
    let picked = [];
    if (mode === 'mix') {
      // 분산 반복 로직: 복습 대기 항목 우선 배치 + 미완료 새 항목 조합
      const revItems = DATA.filter(d => reviewPool.includes(d.id));
      const newItems = DATA.filter(d => !masteredIds.includes(d.id) && !reviewPool.includes(d.id));
      picked = revItems.concat(newItems);
      if (picked.length < 6) {
        picked = picked.concat(DATA);
      }
      picked = picked.slice(0, 6);
    } else {
      picked = DATA.filter(d => d.lv === mode).slice(0, 6);
    }

    queue = picked;
    idx = 0;
    earnedInRound = 0;
    showView('viewStudy');
    renderCard();
  }

  function renderCard() {
    const item = queue[idx];
    tries = 0;

    const pct = Math.round((idx / queue.length) * 100);
    document.getElementById('barFill').style.width = pct + '%';
    document.getElementById('stepLabel').textContent = (idx + 1) + '/' + queue.length;

    const lvTag = document.getElementById('levelTag');
    if (reviewPool.includes(item.id)) {
      lvTag.textContent = '🔄 복습 · ' + item.lv + '단계';
      lvTag.className = 'tag review-tag';
    } else {
      lvTag.textContent = item.lv + '단계';
      lvTag.className = 'tag';
    }

    document.getElementById('pointTag').textContent = item.point;
    document.getElementById('itemPic').textContent = item.pic;
    document.getElementById('itemDisplay').innerHTML = item.html;
    document.getElementById('itemBeat').textContent = '리듬: ' + item.beat;
    document.getElementById('itemKo').textContent = item.ko;
    document.getElementById('itemTip').innerHTML = '💡 ' + item.tip;

    document.getElementById('msgMain').style.color = '#1d4ed8';
    document.getElementById('msgMain').textContent = "먼저 '보통 듣기'를 누르고 따라 말해보세요!";
    document.getElementById('msgSub').textContent = '';

    document.getElementById('btnMic').style.display = 'inline-block';
    document.getElementById('btnPass').style.display = 'inline-block';
    document.getElementById('btnNext').style.display = 'none';
  }

  function playAudio(speed) {
    if (!window.speechSynthesis) {
      document.getElementById('msgMain').textContent = '이 기기에서는 음성 듣기가 지원되지 않아요.';
      return;
    }
    window.speechSynthesis.cancel();
    const item = queue[idx];
    const u = new SpeechSynthesisUtterance(item.word);
    u.lang = 'en-US';
    u.rate = speed;
    window.speechSynthesis.speak(u);
  }

  function setupSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.lang = 'en-US';
    r.interimResults = false;
    r.maxAlternatives = 3;

    r.onstart = function() {
      listening = true;
      const btn = document.getElementById('btnMic');
      btn.className = 'btn-speak recording';
      btn.textContent = '👂 듣는 중...';
      document.getElementById('msgMain').style.color = '#ef4444';
      document.getElementById('msgMain').textContent = '지금 크게 말해보세요!';
    };

    r.onend = function() {
      listening = false;
      const btn = document.getElementById('btnMic');
      btn.className = 'btn-speak';
      btn.textContent = '🎤 따라 말하기';
    };

    r.onerror = function() {
      listening = false;
      const btn = document.getElementById('btnMic');
      btn.className = 'btn-speak';
      btn.textContent = '🎤 따라 말하기';
      document.getElementById('msgMain').style.color = '#d97706';
      document.getElementById('msgMain').textContent = '소리가 잘 안 들렸어요. 다시 눌러 말하거나 건너뛰기를 눌러주세요.';
    };

    r.onresult = function(e) {
      const list = [];
      for (let i = 0; i < e.results[0].length; i++) {
        list.push(e.results[0][i].transcript);
      }
      checkSpeech(list);
    };

    return r;
  }

  function listen() {
    if (!rec) {
      rec = setupSpeech();
    }
    if (!rec) {
      document.getElementById('msgMain').style.color = '#ef4444';
      document.getElementById('msgMain').textContent = '현재 브라우저에서는 마이크 인식을 쓸 수 없어요. [건너뛰기]로 다음 문제를 볼 수 있어요!';
      return;
    }
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }
    if (listening) {
      rec.stop();
    } else {
      try {
        rec.start();
      } catch (err) {}
    }
  }

  function clean(str) {
    return str.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
  }

  function similarity(a, b) {
    if (a === b) return 1;
    if (!a.length || !b.length) return 0;
    let match = 0;
    const wordsA = a.split(/\s+/);
    const wordsB = b.split(/\s+/);
    wordsA.forEach(wa => {
      if (wordsB.some(wb => wb === wa || (wa.length > 2 && wb.includes(wa)))) {
        match++;
      }
    });
    return match / wordsA.length;
  }

  function checkSpeech(candidates) {
    const item = queue[idx];
    const target = clean(item.word);
    tries++;

    let best = candidates[0] || '';
    let pass = false;

    for (let i = 0; i < candidates.length; i++) {
      const c = clean(candidates[i]);
      if (c === target || c.includes(target) || similarity(target, c) >= 0.7) {
        best = candidates[i];
        pass = true;
        break;
      }
    }

    if (pass) {
      const addStar = tries === 1 ? 2 : 1;
      stars += addStar;
      earnedInRound += addStar;
      document.getElementById('starCount').textContent = stars;

      // 분산 반복 상태 갱신
      if (tries === 1) {
        reviewPool = reviewPool.filter(id => id !== item.id);
        if (!masteredIds.includes(item.id)) masteredIds.push(item.id);
      } else {
        // 여러 번 시도해서 맞힌 경우 복습 큐에 등록하여 나중에 다시 연습
        if (!reviewPool.includes(item.id)) reviewPool.push(item.id);
      }

      document.getElementById('msgMain').style.color = '#10b981';
      document.getElementById('msgMain').textContent = '참 잘했어요! 정확하게 말했어요! (+⭐' + addStar + ')';
      document.getElementById('msgSub').textContent = '인식된 소리: "' + best + '"';

      document.getElementById('btnMic').style.display = 'none';
      document.getElementById('btnPass').style.display = 'none';
      document.getElementById('btnNext').style.display = 'inline-block';
    } else {
      // 틀린 항목은 복습 대기열에 추가
      if (!reviewPool.includes(item.id)) reviewPool.push(item.id);

      document.getElementById('msgMain').style.color = '#d97706';
      document.getElementById('msgMain').textContent = '조금만 더! 🐢 느리게 듣기를 듣고 다시 도전해 보세요!';
      document.getElementById('msgSub').textContent = '들린 소리: "' + best + '"';

      if (tries >= 2) {
        document.getElementById('btnNext').style.display = 'inline-block';
      }
    }
  }

  function next() {
    idx++;
    if (idx >= queue.length) {
      document.getElementById('barFill').style.width = '100%';
      document.getElementById('doneText').innerHTML =
        '이번 라운드에서 별 <strong>⭐ ' + earnedInRound + '개</strong>를 얻었어요!<br>' +
        '복습이 필요한 표현은 기억력 창고에 저장되어 다음 코스에서 다시 만날 수 있어요.';
      refreshMenu();
      showView('viewDone');
    } else {
      renderCard();
    }
  }

  function pass() {
    const item = queue[idx];
    if (!reviewPool.includes(item.id)) reviewPool.push(item.id);
    // 분산 반복 효과: 건너뛴 문제를 현재 세션의 뒤쪽에 다시 배치
    if (queue.length - idx > 2) {
      queue.push(item);
    }
    next();
  }

  function goMenu() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (listening && rec) rec.stop();
    refreshMenu();
    showView('viewMenu');
  }

  refreshMenu();

  return {
    begin: begin,
    playAudio: playAudio,
    listen: listen,
    next: next,
    pass: pass,
    goMenu: goMenu
  };
})();
</script>
